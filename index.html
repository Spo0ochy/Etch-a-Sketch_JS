<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Etch-a-sketch</title>
    <script src="index.js" type="module" deref></script>
</head>
<body>
    <div class="main">
        <h1>Etch-A-Sketch Javascript</h1>
        
        <div class="frame">
            <div class="display"></div>
        </div>

        <div class="line"></div>

        <div class="settingsDisplay">
            <input type="number" placeholder="Size : 2 - 100">
            <div class="btn-shadow">
                <button>←</button>
            </div>
        </div>

        <form action="" class="select-mod">
            <div class="btn-shadow">
                <input type="radio" name="settingTool" id="brush" value="brush" checked>
                <label for="brush">BRUSH</label>
            </div>
            <div class="btn-shadow">
                <input type="radio" name="settingTool" id="eraser" value="eraser">
                <label for="eraser">ERASER</label>
            </div>
            <div class="btn-shadow">
                <input type="radio" name="settingTool" id="colorful" value="colorful">
                <label for="colorful">COLORFUL</label>
            </div>
            <div class="btn-shadow">
                <input type="radio" name="settingTool" id="pencil" value="pencil">
                <label for="pencil">PENCIL</label>
            </div>
        </form>
    </div>
</body>
</html>
