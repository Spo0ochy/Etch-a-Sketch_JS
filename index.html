<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Etch-a-sketch</title>
    <script src="index.js" type="module" deref></script>
</head>
<body>
    <div class="main">
        <h1>Etch-A-Sketch Javascript</h1>
        
        <div class="frame">
            <div class="display"></div>
        </div>

        <div class="line"></div>

        <div class="settingsDisplay">
            <input type="number" placeholder="Size : 2 - 100">
            <button>Enter the size</button>
        </div>
    
        <button class="brush">Brush</button>
        <button class="eraser">Eraser</button>
        <button class="colorful">Colorful</button>
        <button class="pencil">Pencil</button>
    </div>
</body>
</html>
